<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Uniform viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141b; color: #d8dee9; font: 12px "Segoe UI", sans-serif; overflow: hidden; }
  #c { display: block; width: 100%; height: 100%; }
  .label { position: absolute; top: 8px; padding: 3px 8px; background: rgba(16,20,27,.8); border-radius: 4px; }
  #l1 { left: 8px; } #l2 { left: calc(50% + 8px); }
  #divider { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: #2c3442; }
  #bar { position: absolute; bottom: 8px; left: 8px; right: 8px; display: flex; gap: 6px; align-items: center; }
  #bar select { background: #1f2633; color: #d8dee9; border: 1px solid #36404f; border-radius: 4px; padding: 3px 6px; }
  #bar button { white-space: nowrap; background: #1f2633; color: #d8dee9; border: 1px solid #36404f; border-radius: 4px; padding: 3px 9px; cursor: pointer; }
  #bar button.on { background: #2f6fd6; border-color: #2f6fd6; color: #fff; }
  #note { margin-left: auto; opacity: .6; font-size: 11px; text-align: right; max-width: 40%; }
  #legend { position: absolute; right: 8px; top: 34px; background: rgba(16,20,27,.85); padding: 6px 8px; border-radius: 4px; display: none; line-height: 1.6; }
  .sw { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: middle; }
  #numspanel { position: absolute; right: 8px; bottom: 46px; display: none; gap: 8px; background: rgba(16,20,27,.94); padding: 8px; border-radius: 6px; border: 1px solid #2c3442; }
  #numspanel .num { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  #numspanel img { width: 230px; height: 230px; object-fit: contain; background: #1f2633; border-radius: 4px; }
  #numspanel span { font-size: 10px; color: #9fb4cf; }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="divider"></div>
<div class="label" id="l1">NHL 27</div>
<div class="label" id="l2">NHL 24 result</div>
<div id="legend"></div>
<div id="numspanel">
  <div class="num"><span>NHL 27 numbers</span><img id="numL" alt=""></div>
  <div class="num"><span>NHL 24 result numbers</span><img id="numR" alt=""></div>
</div>
<div id="bar">
  <button data-mode="lit" class="on">Shaded</button>
  <button data-mode="flat">Flat texture</button>
  <button data-mode="regions">Fabric regions</button>
  <button id="spin">Turntable</button>
  <button id="helmetBtn" class="on">Helmet</button>
  <button id="headBtn" class="on">Head</button>
  <button id="numsBtn">Numbers</button>
  <select id="views"><option value="">Camera…</option><option value="front">Front</option><option value="back">Back</option><option value="left">Left</option><option value="right">Right</option><option value="threequarter">3/4</option><option value="fit">Fit uniform</option><option value="jersey">Jersey close-up</option><option value="skates">Skates close-up</option></select>
  <button id="png">Export PNG</button>
  <span id="note">Loading the NHL 24 skater meshes…</span>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './lib/OrbitControls.js';
import { GLTFLoader } from './lib/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setScissorTest(true);

const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
camera.position.set(0, 1.1, 5.6);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;

const loader = new THREE.TextureLoader();
const cache = new Map();
const PARTS = ['jersey', 'pant', 'sock'];
const gltf = new GLTFLoader();
let showHead = true, showHelmet = true, realMeshes = false;
let mode = 'lit';
let spin = false;

// Region palettes: NHL 24 uses 51/102/153/204, NHL 26/27 64/127/191/255 (TEXTURE_REPLACEMENT rule 11).
const REGION_COLORS = [[0.15,0.15,0.15],[0.25,0.55,0.95],[0.95,0.75,0.2],[0.3,0.8,0.45],[0.9,0.3,0.35]];
const regionShader = {
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D map; uniform bool hasMap; uniform vec4 levels; uniform vec3 c0,c1,c2,c3,c4; varying vec2 vUv;
    void main(){
      if(!hasMap){ gl_FragColor = vec4(0.2,0.2,0.22,1.0); return; }
      vec4 t = texture2D(map, vUv); float a = t.a * 255.0; vec3 c = c0;
      float d1 = abs(a-levels.x), d2 = abs(a-levels.y), d3 = abs(a-levels.z), d4 = abs(a-levels.w);
      float m = min(min(d1,d2),min(d3,d4));
      if (m < 20.0) { c = (m==d1)?c1:(m==d2)?c2:(m==d3)?c3:c4; }
      gl_FragColor = vec4(mix(c, t.rgb, 0.25), 1.0);
    }`,
};

function makeSide(levels) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x10141b);
  scene.add(new THREE.HemisphereLight(0xdde6ff, 0x20242c, 1.2));
  const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 4, 3); scene.add(key);
  const rim = new THREE.DirectionalLight(0x9fb6ff, 0.8); rim.position.set(-3, 2, -3); scene.add(rim);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(1.2, 64), new THREE.MeshStandardMaterial({ color: 0xe8eef5, roughness: 0.35 }));
  floor.rotation.x = -Math.PI / 2; scene.add(floor);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.9, 0.93, 96), new THREE.MeshBasicMaterial({ color: 0xc8102e }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.002; scene.add(ring);

  const side = { scene, levels, mats: {}, tex: {}, flat: new THREE.Group(), body: new THREE.Group() };
  for (const p of PARTS) {
    side.mats[p] = {
      lit: new THREE.MeshStandardMaterial({ color: 0x5a6070, roughness: 0.85, metalness: 0.0, side: THREE.DoubleSide }),
      flat: new THREE.MeshBasicMaterial({ color: 0x5a6070, side: THREE.DoubleSide }),
      regions: new THREE.ShaderMaterial({
        uniforms: { map: { value: null }, hasMap: { value: false }, levels: { value: new THREE.Vector4(...levels) },
          c0: { value: new THREE.Vector3(...REGION_COLORS[0]) }, c1: { value: new THREE.Vector3(...REGION_COLORS[1]) },
          c2: { value: new THREE.Vector3(...REGION_COLORS[2]) }, c3: { value: new THREE.Vector3(...REGION_COLORS[3]) },
          c4: { value: new THREE.Vector3(...REGION_COLORS[4]) } },
        vertexShader: regionShader.vertexShader, fragmentShader: regionShader.fragmentShader, side: THREE.DoubleSide }),
    };
  }
  buildFlat(side);
  scene.add(side.body, side.flat);
  return side;
}

function lathe(points, segs = 48) { return new THREE.LatheGeometry(points.map(([r, y]) => new THREE.Vector2(r, y)), segs); }

function buildFlat(side) {
  const sizes = { jersey: [1.3, 1.3, 0, 1.72], pant: [0.62, 0.62, -0.34, 0.62], sock: [0.62, 0.62, 0.34, 0.62] };
  for (const p of PARTS) {
    const [w, h, x, y] = sizes[p];
    const geo = new THREE.PlaneGeometry(w, h);
    const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setY(i, 1 - uv.getY(i));
    const m = new THREE.Mesh(geo, side.mats[p].flat);
    m.position.set(x, y, 0); m.userData.part = p; side.flat.add(m);
  }
  side.flat.visible = false;
}

const left = makeSide([64, 127, 191, 255]);
const right = makeSide([51, 102, 153, 204]);

function applyMode() {
  for (const side of [left, right]) {
    side.body.visible = mode !== 'flat';
    side.flat.visible = mode === 'flat';
    side.body.traverse(o => { if (o.isMesh && o.userData.part) o.material = side.mats[o.userData.part][mode === 'flat' ? 'lit' : mode]; });
    side.flat.traverse(o => { if (o.isMesh && o.userData.part) o.material = side.mats[o.userData.part].flat; });
    if (side.helmetDecals) for (const d of side.helmetDecals) d.visible = mode !== 'flat' && showHelmet;
    if (side.jerseyText) side.jerseyText.visible = mode !== 'flat';
  }
  document.querySelectorAll('#bar button[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  const legend = document.getElementById('legend');
  legend.style.display = mode === 'regions' ? 'block' : 'none';
  legend.innerHTML = 'Alpha = fabric region, not transparency<br>' +
    ['NHL 27: 64 / NHL 24: 51 body', 'NHL 27: 127 / NHL 24: 102 band (dimples)', 'NHL 27: 191 / NHL 24: 153 underarm', 'NHL 27: 255 / NHL 24: 204 crest']
      .map((t, i) => `<span class="sw" style="background:rgb(${REGION_COLORS[i + 1].map(v => v * 255).join(',')})"></span>${t}`).join('<br>');
}

function loadTexture(url, srgb) {
  const key = url + (srgb ? '#s' : '#l');
  if (cache.has(key)) return Promise.resolve(cache.get(key));
  return new Promise(resolve => loader.load(url, t => {
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.flipY = false; // game meshes use a top-left UV origin (glTF convention)
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    cache.set(key, t); resolve(t);
  }, undefined, () => resolve(null)));
}

function applyRegionMap(mats) {
  // The region shader reads alpha: prefer the _base_ colour map (fabric-region index) and fall back to the art map.
  const t = mats.regionMap || mats.colorMap || null;
  mats.regions.uniforms.map.value = t;
  mats.regions.uniforms.hasMap.value = !!t;
  mats.regions.needsUpdate = true;
}

async function setTexture(sideId, part, role, url) {
  const side = sideId === 'l' ? left : right;
  const mats = side.mats[part];
  if (!mats) return;
  const tex = url ? await loadTexture(url, role === 'color') : null;
  if (role === 'color') {
    for (const m of [mats.lit, mats.flat]) { m.map = tex; m.color.set(tex ? 0xffffff : 0x5a6070); m.needsUpdate = true; }
    mats.colorMap = tex;
    applyRegionMap(mats);
  } else if (role === 'normal') {
    mats.lit.normalMap = tex; mats.lit.needsUpdate = true;
  }
}

async function setRegionTexture(sideId, part, url) {
  const side = sideId === 'l' ? left : right;
  const mats = side.mats[part];
  if (!mats) return;
  mats.regionMap = url ? await loadTexture(url, true) : null;
  applyRegionMap(mats);
}

// ---------------------------------------------------------------- real NHL 24 meshes
// items: [{ url, part }]; part is jersey/pant/sock (textured from the matcher) or helmet/glove/skate/head/hands.
// Helmet and gloves take the team's DB colours; skates stay dark. The helmet decal is the helmetlogo texture.
const SKIN = 0xd9b59a;
let teamColors = { primary: 0x14223a, secondary: 0x202226, skate: 0x202226 };

function newGear() {
  return {
    helmet: new THREE.MeshStandardMaterial({ color: teamColors.primary, roughness: 0.35, metalness: 0 }),
    glove: new THREE.MeshStandardMaterial({ color: teamColors.primary, roughness: 0.7, metalness: 0 }),
    skate: new THREE.MeshStandardMaterial({ color: teamColors.skate, roughness: 0.7, metalness: 0.3 }),
    head: new THREE.MeshStandardMaterial({ color: SKIN, roughness: 0.7 }),
    hands: new THREE.MeshStandardMaterial({ color: SKIN, roughness: 0.7 }),
  };
}

function applyTeamColors() {
  for (const side of [left, right]) {
    if (!side.gear) continue;
    side.gear.helmet.color.setHex(teamColors.primary);
    side.gear.glove.color.setHex(teamColors.primary);
    side.gear.skate.color.setHex(teamColors.skate);
  }
}

function setTeamColors(primary, secondary) {
  const parse = (v, fallback) => {
    const n = parseInt((v || '').replace('#', ''), 16);
    return Number.isFinite(n) ? n : fallback;
  };
  teamColors.primary = parse(primary, teamColors.primary);
  teamColors.secondary = parse(secondary, teamColors.secondary);
  // Skates: keep them dark; use the secondary only when it is dark enough to read as a skate.
  const lum = ((teamColors.secondary >> 16 & 255) * 0.3 + (teamColors.secondary >> 8 & 255) * 0.59 + (teamColors.secondary & 255) * 0.11) / 255;
  teamColors.skate = lum < 0.45 ? teamColors.secondary : 0x202226;
  applyTeamColors();
}

async function setHelmetLogo(sideId, url) {
  const side = sideId === 'l' ? left : right;
  side.helmetLogoUrl = url;
  if (side.helmetDecals) {
    for (const d of side.helmetDecals) { side.body.remove(d); d.geometry.dispose(); }
    side.helmetDecals = [];
  }
  if (!url) return;
  const tex = await loadTexture(url, true);
  if (tex) placeHelmetLogo(side, tex);
}

function placeHelmetLogo(side, tex) {
  const helmet = side.body.children.find(c => c.userData.kind === 'helmet');
  if (!helmet) return;
  const box = new THREE.Box3().setFromObject(helmet);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);

  const mat = new THREE.MeshStandardMaterial({
    map: tex, transparent: true, roughness: 0.45, metalness: 0, side: THREE.DoubleSide,
    depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  });
  const R = Math.PI / 180;
  // Two spherical caps on the upper sides of the helmet, so the logo follows the shell instead of floating on a card.
  const caps = [-35 * R, Math.PI - 35 * R];
  side.helmetDecals = [];
  for (const phiStart of caps) {
    const geo = new THREE.SphereGeometry(1, 28, 16, phiStart, 70 * R, 22 * R, 26 * R);
    const m = new THREE.Mesh(geo, mat);
    m.position.copy(center);
    m.scale.set(size.x * 0.52, size.y * 0.52, size.z * 0.52);
    m.userData.helmetDecal = true;
    m.visible = showHelmet && mode !== 'flat';
    side.body.add(m);
    side.helmetDecals.push(m);
  }
}

async function loadMeshes(items) {
  const loaded = await Promise.all(items.map(it => gltf.loadAsync(it.url).then(g => ({ it, g })).catch(e => { console.error(it.url, e); return null; })));
  const ok = loaded.filter(x => x);
  if (ok.length === 0) { document.getElementById('note').textContent = 'Could not load the NHL 24 meshes; placeholder shown.'; return; }
  for (const side of [left, right]) {
    side.body.clear();
    side.helmetDecals = [];
    side.jerseyText = null;
    const gear = newGear();
    side.gear = gear;
    for (const { it, g } of ok) {
      const root = g.scene.clone(true);
      root.traverse(o => {
        if (!o.isMesh) return;
        if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
        o.userData.part = PARTS.includes(it.part) ? it.part : null;
        o.material = o.userData.part ? side.mats[it.part][mode === 'flat' ? 'lit' : mode] : (gear[it.part] || gear.helmet);
      });
      root.userData.kind = it.part;
      side.body.add(root);
    }
  }
  realMeshes = true;
  applyToggles();
  for (const sideId of ['l', 'r']) {
    const side = sideId === 'l' ? left : right;
    if (side.helmetLogoUrl) setHelmetLogo(sideId, side.helmetLogoUrl);
    if (side.fontUrl) setJerseyNumber(sideId, side.fontUrl);
  }
  const box = new THREE.Box3().setFromObject(left.body);
  document.getElementById('note').textContent =
    `NHL 24 skater meshes (LOD0, bind pose) · height ${box.max.y.toFixed(2)} m · width ${(box.max.x - box.min.x).toFixed(2)} m`;
  window.chrome?.webview?.postMessage({ type: 'meshes', count: ok.length, height: box.max.y, width: box.max.x - box.min.x });
}

function applyToggles() {
  for (const side of [left, right]) {
    side.body.children.forEach(c => {
      if (c.userData.kind === 'helmet') c.visible = showHelmet;
      if (c.userData.kind === 'head') c.visible = showHead;
    });
    if (side.helmetDecals) for (const d of side.helmetDecals) d.visible = showHelmet && mode !== 'flat';
  }
  document.getElementById('helmetBtn')?.classList.toggle('on', showHelmet);
  document.getElementById('headBtn')?.classList.toggle('on', showHead);
}

// Camera presets for a ~1.9 m skater standing at the origin.
const VIEWS = {
  front: [[0, 1.05, 4.6], [0, 1.0, 0]], back: [[0, 1.05, -4.6], [0, 1.0, 0]], left: [[4.6, 1.05, 0], [0, 1.0, 0]], right: [[-4.6, 1.05, 0], [0, 1.0, 0]],
  threequarter: [[3.2, 1.4, 3.4], [0, 1.0, 0]], fit: [[0, 1.0, 5.4], [0, 0.98, 0]], jersey: [[0, 1.4, 1.9], [0, 1.32, 0]], skates: [[0.9, 0.35, 1.3], [0, 0.15, 0]],
};
function view(name) { const v = VIEWS[name]; if (!v) return; camera.position.set(...v[0]); controls.target.set(...v[1]); controls.update(); }

function exportPng() {
  const a = document.createElement('a'); a.download = 'uniform.png'; a.href = canvas.toDataURL('image/png'); a.click();
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * devicePixelRatio) || canvas.height !== Math.floor(h * devicePixelRatio)) renderer.setSize(w, h, false);
  camera.aspect = (w / 2) / h; camera.updateProjectionMatrix();
}

function frame(t) {
  resize();
  controls.update();
  if (spin) for (const s of [left, right]) s.body.rotation.y = t * 0.0005;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setViewport(0, 0, w / 2, h); renderer.setScissor(0, 0, w / 2, h); renderer.render(left.scene, camera);
  renderer.setViewport(w / 2, 0, w / 2, h); renderer.setScissor(w / 2, 0, w / 2, h); renderer.render(right.scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.querySelectorAll('#bar button[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; applyMode(); });
document.getElementById('spin').onclick = e => { spin = !spin; e.target.classList.toggle('on', spin); if (!spin) for (const s of [left, right]) s.body.rotation.y = 0; };
document.getElementById('helmetBtn').onclick = () => { showHelmet = !showHelmet; applyToggles(); };
document.getElementById('headBtn').onclick = () => { showHead = !showHead; applyToggles(); };
document.getElementById('views').onchange = e => { view(e.target.value); e.target.value = ''; };
document.getElementById('png').onclick = exportPng;
document.getElementById('numsBtn').onclick = () => {
  const p = document.getElementById('numspanel');
  const open = p.style.display !== 'flex';
  p.style.display = open ? 'flex' : 'none';
  document.getElementById('numsBtn').classList.toggle('on', open);
};
applyMode();
view('fit');

// ---------------------------------------------------------------- numbers and name on the jersey
// The number glyphs come from the game's font atlas (the small digit row), so a replaced font shows here.
// The cells below were measured on the 2048-square NHL 27 atlas. NHL 24's atlas is 1024 square with the
// same layout, so every cell is scaled to the atlas that actually arrives instead of assuming 2048.
// Each glyph keeps its own cell width (a '1' is much narrower than a '9'), and the panel canvas matches
// the plane's real 0.38 x 0.46 m aspect, so nothing is stretched: the digits keep the game's proportions.
const DIGIT_CELLS = [[18,173],[208,303],[402,557],[594,749],[781,946],[978,1133],[1170,1325],[1362,1517],[1555,1710],[1746,1901]];
const DIGIT_ROW = [1490, 1775];
const DIGIT_ATLAS = 2048;
// The atlas letter rows, measured on the same 2048-square NHL 27 atlas. Every set (and NHL 24's 1024-square atlas) uses
// the same layout, so these are scaled exactly like the digits; the wide C/A marks are left out on purpose.
// Both rows are exactly the same cap height (173 px): scaling per row is what keeps every letter the same size,
// even though the letters are split across two rows of the sheet.
const LETTER_ROWS = [[10, 182], [202, 374]];
const LETTER_CELLS = {
  A: [0, 12, 115], B: [0, 140, 243], C: [0, 268, 371], D: [0, 396, 499], E: [0, 524, 627],
  F: [0, 652, 755], G: [0, 780, 883], H: [0, 908, 1011], I: [0, 1036, 1075], J: [0, 1164, 1267],
  K: [0, 1292, 1397], L: [0, 1420, 1523], M: [0, 1612, 1715], N: [0, 1804, 1907], O: [0, 1932, 2035],
  P: [1, 12, 115], Q: [1, 140, 243], R: [1, 268, 371], S: [1, 396, 499], T: [1, 524, 627],
  U: [1, 652, 755], V: [1, 780, 883], W: [1, 972, 1075], X: [1, 1163, 1268], Y: [1, 1291, 1396],
  Z: [1, 1419, 1524], "'": [0, 1551, 1583], ".": [0, 1747, 1771], "-": [1, 1612, 1651],
};
// The plane placeJerseyNumber puts on the jersey back, in metres.
const PANEL = { w: 0.38, h: 0.46 };
// Panel texture resolution: about 1.6x the atlas glyph height, so the digits stay sharp without going soft.
const PANEL_TPM = 1680;

function composeJerseyText(atlas, number = '92', name = 'COOLEY') {
  const W = Math.round(PANEL.w * PANEL_TPM), H = Math.round(PANEL.h * PANEL_TPM);
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  const aw = atlas.naturalWidth || atlas.width || DIGIT_ATLAS;
  const ah = atlas.naturalHeight || atlas.height || DIGIT_ATLAS;
  const s = aw / DIGIT_ATLAS;

  // Name above the number, in the game's own lettering: every glyph comes from the atlas, so a replaced font or a
  // team's own letter shape shows here exactly as it will in game. Unknown characters are skipped.
  const nameH = 0.054 * PANEL_TPM;
  const nameTracking = 0.02 * nameH;   // the atlas cells already carry their own side bearings
  const letters = [...String(name).toUpperCase()].map(ch => LETTER_CELLS[ch]).filter(Boolean).map(([row, x0, x1]) => {
    const [y0, y1] = LETTER_ROWS[row];
    const sx = x0 * s, sy = y0 * s;
    const sw = Math.min((x1 - x0 + 1) * s, aw - sx);
    const sh = Math.min((y1 - y0 + 1) * s, ah - sy);
    return { sx, sy, sw, sh, w: sw * nameH / sh };
  });
  if (letters.length > 0) {
    let nx = (W - (letters.reduce((a, l) => a + l.w, 0) + nameTracking * (letters.length - 1))) / 2;
    const ny = 0.026 * PANEL_TPM;
    for (const l of letters) {
      ctx.drawImage(atlas, l.sx, l.sy, l.sw, l.sh, nx, ny, l.w, nameH);
      nx += l.w + nameTracking;
    }
  }
  const glyphs = String(number).padStart(2, '0').split('').map(ch => {
    const [x0, x1] = DIGIT_CELLS[Math.max(0, Math.min(9, parseInt(ch, 10) || 0))];
    const sx = x0 * s, sy = DIGIT_ROW[0] * s;
    return { sx, sy, sw: Math.min((x1 - x0 + 1) * s, aw - sx), sh: Math.min((DIGIT_ROW[1] - DIGIT_ROW[0] + 1) * s, ah - sy) };
  }).filter(g => g.sw > 0 && g.sh > 0);
  if (glyphs.length === 0) return c;

  const height = 0.285 * PANEL_TPM;   // a real back number is roughly 28 cm tall
  const gap = -0.03 * height;         // the two digits butt together, as they do in game
  const widths = glyphs.map(g => g.sw * height / g.sh);
  let x = (W - (widths.reduce((a, b) => a + b, 0) + gap * (glyphs.length - 1))) / 2;
  const top = 0.118 * PANEL_TPM;
  glyphs.forEach((g, i) => {
    ctx.drawImage(atlas, g.sx, g.sy, g.sw, g.sh, x, top, widths[i], height);
    x += widths[i] + gap;
  });
  return c;
}

async function setJerseyNumber(sideId, url) {
  const side = sideId === 'l' ? left : right;
  if (side.jerseyText) {
    side.body.remove(side.jerseyText);
    side.jerseyText.geometry.dispose();
    side.jerseyText.material.dispose();
    side.jerseyText = null;
  }
  side.fontUrl = url;
  if (!url) return;
  const atlas = await new Promise(resolve =>
  {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => resolve(null);
    im.src = url;
  });
  if (!atlas) return;
  const tex = new THREE.CanvasTexture(composeJerseyText(atlas));
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  placeJerseyNumber(side, tex);
}

function placeJerseyNumber(side, tex) {
  const jersey = side.body.children.find(c => c.userData.kind === 'jersey');
  if (!jersey) return;
  const box = new THREE.Box3().setFromObject(jersey);
  const size = new THREE.Vector3();
  box.getSize(size);
  // Real jersey back lettering: a ~28 cm number with the name above it, so the panel is sized in metres,
  // not as a fraction of the mesh bounds. The texture is composed at this exact aspect (see PANEL).
  const geo = new THREE.PlaneGeometry(PANEL.w, PANEL.h);
  const mat = new THREE.MeshStandardMaterial({
    map: tex, transparent: true, roughness: 0.85, metalness: 0, side: THREE.DoubleSide,
    depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3,
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.set((box.min.x + box.max.x) / 2, box.min.y + size.y * 0.62, box.min.z - 0.006);
  m.rotation.y = Math.PI; // face the back of the skater
  m.userData.jerseyText = true;
  m.visible = mode !== 'flat';
  side.body.add(m);
  side.jerseyText = m;
}

function setFontImage(side, url) {
  const img = document.getElementById(side === 'l' ? 'numL' : 'numR');
  if (!img) return;
  if (url) img.src = url; else img.removeAttribute('src');
  setJerseyNumber(side, url);
}

function handle(msg) {
  if (!msg) return;
  if (msg.type === 'tex') setTexture(msg.side, msg.part, msg.role, msg.url);
  else if (msg.type === 'region') setRegionTexture(msg.side, msg.part, msg.url);
  else if (msg.type === 'font') setFontImage(msg.side, msg.url);
  else if (msg.type === 'colors') setTeamColors(msg.primary, msg.secondary);
  else if (msg.type === 'helmetlogo') setHelmetLogo(msg.side, msg.url);
  else if (msg.type === 'labels') { document.getElementById('l1').textContent = msg.left; document.getElementById('l2').textContent = msg.right; }
  else if (msg.type === 'mode') { mode = msg.mode; applyMode(); }
  else if (msg.type === 'meshes') loadMeshes(msg.items);
  else if (msg.type === 'view') view(msg.name);
  else if (msg.type === 'clear') { for (const s of ['l', 'r']) for (const p of PARTS) { setTexture(s, p, 'color', null); setTexture(s, p, 'normal', null); setRegionTexture(s, p, null); } setFontImage('l', null); setFontImage('r', null); }
}
window.viewer = { handle };
if (window.chrome && window.chrome.webview) {
  window.chrome.webview.addEventListener('message', e => handle(e.data));
  window.chrome.webview.postMessage({ type: 'ready', gpu: renderer.getContext().getParameter(renderer.getContext().VERSION) });
}
</script>
</body>
</html>
